[project]
name = "do-shell"
version = "0.8.0"
description = "Natural language to shell commands -- translates verbatim, never advises"
requires-python = ">=3.11"
License = "MIT"


dependencies = [
    "gnureadline>=8.3.3 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
# A real bash AST for parse.py. 
parse = ["bashlex>=0.18"]

[project.scripts]
Do = "do.cli:main"
dod = "do.daemon:main"

[dependency-groups]
# uv installs these by default for local work but they never reach a wheel.
# PyYAML is only for tests/golden/commands.yaml.
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["do"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # test_golden.py needs a running daemon and a loaded model, so it is opt-in
    # (`-m slow`). The safety and parse suites are the gate that always runs.
    "slow: requires a running daemon and the model file",
]
